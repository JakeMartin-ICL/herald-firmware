name: Check Firmware

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test LED sector expansion
        run: python3 scripts/test_led_sectors.py

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile release firmware without publishing
        run: pio run -e esp32dev-release
